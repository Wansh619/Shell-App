

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>

<div id="terminal-reveal-frame" class="terminal-reveal-frame">
    <svg class="terminal-border-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <rect class="terminal-border-rect" x="1" y="1" width="98" height="98" rx="8" ry="8" fill="none" stroke="currentColor" pathLength="400" />
    </svg>
    <div id="terminal-wrapper" class="terminal-wrapper terminal-hidden">
        <div class="card">
            <nav class="terminal-session-panel">
                <div id="terminal-tabs" class="terminal-tabs"></div>
                <button id="new-terminal-tab" class="new-terminal-tab" type="button">+ New Tab</button>
            </nav>
            <div class="terminal-panel-container">
                <div id="terminal-panels"></div>
            </div>
        </div>
    </div>
</div>
